        function initGame() {
            const currentData = quizDatabase[currentQuestionIndex];
            
            // Set question counter header and definition text

                button.innerText = currentData.choices[i];
                button.disabled = false; // Reset buttons to active status
                button.style.backgroundColor = "#121212"; // Reset option colors back to flat gray
                button.style.borderColor = "#660708";
            }
            
            // Hide the next step controller action layer and clear active log tags
            document.getElementById("feedback-message").innerText = "";
            document.getElementById("next-question-btn").style.display = "none";
        }

        function checkAnswer(selectedIndex) {
            const currentData = quizDatabase[currentQuestionIndex];
            const feedbackText = document.getElementById("feedback-message");
            
            if (selectedIndex === currentData.correct) {
                // Correct Answer Selected Action Pipeline
                feedbackText.innerText = "✓ CORRECT!";
                feedbackText.style.color = "#00ff00"; // Bright clinical neon green
                
                // Color the correct choice background green
                document.getElementById(`opt${selectedIndex}`).style.backgroundColor = "#002b00";
                document.getElementById(`opt${selectedIndex}`).style.borderColor = "#00ff00";
                
                // Lock down choice buttons so user can't click other options after winning
                for (let i = 0; i < 4; i++) {
                    document.getElementById(`opt${i}`).disabled = true;
                }
                
                // Show the next question action bridge
                document.getElementById("next-question-btn").style.display = "block";
            } else {
                // Incorrect Answer Selected Action Pipeline
                feedbackText.innerText = "❌ WRONG, TRY AGAIN.";
                feedbackText.style.color = "#ba181b"; // Deep clinical emergency red
                
                // Highlight the specific wrong button clicked to track attempts
                document.getElementById(`opt${selectedIndex}`).style.backgroundColor = "#2b0000";
                document.getElementById(`opt${selectedIndex}`).style.borderColor = "#ba181b";
            }
        }

        function loadNextQuestion() {
            currentQuestionIndex++;
            
            // Loop array processing cycle checks to handle final game completion routes
            if (currentQuestionIndex < quizDatabase.length) {
                initGame();
            } else {
                // End Game Protocol: Clear dashboard panels and offer reboot routine options
                document.getElementById("question-number").innerText = "SIMULATION COMPLETE";
                document.getElementById("definition-display").innerText = "All vocabulary data modules successfully verified. Diagnostic evaluation complete.";

                document.getElementById("feedback-message").innerText = "🏆 100% SUCCESS RATE";

                actionBtn.innerText = "restart simulation";
                actionBtn.onclick = function() {
                    currentQuestionIndex = 0;
                    document.getElementById("options-grid").style.display = "grid";
                    actionBtn.onclick = loadNextQuestion; // Reset behavior path logic rules
                    initGame();
                };
            }
